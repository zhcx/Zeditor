name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable release tag to build
        required: true
      # 局部重建入口：只重跑某一平台的构建并替换该平台的安装包，
      # 其余平台已发布的资产保持不变（全平台标签推送无需传该参数）。
      platforms:
        description: Which platforms to rebuild (partial runs keep other platforms' assets)
        required: false
        default: all
        type: choice
        options:
          - all
          - macos
          - linux
          - windows

permissions:
  actions: read
  contents: write

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
  BUILD_PLATFORMS: ${{ github.event.inputs.platforms || 'all' }}

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  quality-checks:
    name: Release quality gate
    runs-on: windows-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Restore Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Upgrade npm for current registry audit endpoint
        run: npm install --global npm@11

      - name: Install locked frontend dependencies
        run: npm ci --no-audit

      - name: Build and stage MCP sidecar for Rust checks
        run: |
          npm run mcp:sidecar -- x86_64-pc-windows-msvc debug

      - name: Check frontend quality
        run: |
          npm run lint
          npm test
          npm run build

      - name: Audit frontend dependencies
        shell: pwsh
        run: |
          $auditOutputPath = Join-Path $env:RUNNER_TEMP 'npm-audit.log'
          npm audit --package-lock-only --audit-level=high --fetch-timeout=30000 --fetch-retries=0 --json *> $auditOutputPath
          $auditExitCode = $LASTEXITCODE
          $auditOutput = Get-Content -LiteralPath $auditOutputPath -Raw
          if ($auditExitCode -eq 0) {
            Write-Host $auditOutput
            exit 0
          }
          if ($auditOutput -match '(?i)audit endpoint returned an error|audit network timeout|EAI_AGAIN|ENOTFOUND|ECONNRESET|ETIMEDOUT|ENETUNREACH') {
            Write-Warning 'npm advisory service is unavailable; the dependency audit could not be completed for this run.'
            Write-Host $auditOutput
            exit 0
          }
          Write-Error $auditOutput
          exit $auditExitCode

      - name: Check Rust quality
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

  prepare-release:
    name: Prepare GitHub release
    needs: quality-checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Create release or refresh release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes_file="docs/releases/${RELEASE_TAG}.md"
          test -f "$notes_file" || { echo "Missing release notes: $notes_file"; exit 1; }
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ "$BUILD_PLATFORMS" = "all" ]; then
              # 全平台重建：清空既有资产，避免新旧产物混在一起。
              gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.assets[].id' |
                while read -r asset_id; do
                  gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
                done
            else
              # 局部重建（如只重发 macOS）：保留其它平台已发布的安装包，
              # 本次构建的平台由 tauri-action「先删同名再上传」就地替换。
              echo "Partial build (${BUILD_PLATFORMS}): keeping other platforms' assets."
            fi
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Zeditor $RELEASE_TAG" \
              --notes-file "$notes_file"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "Zeditor $RELEASE_TAG" \
              --notes-file "$notes_file"
          fi

  # macOS 与 Linux 拆成两个任务：任务级 if 读不到 matrix 上下文，
  # 拆开才能用 platform 输入精确跳过不需要重建的平台。
  build-macos:
    name: ${{ matrix.name }}
    needs: prepare-release
    if: ${{ github.event_name == 'push' || github.event.inputs.platforms == '' || github.event.inputs.platforms == 'all' || github.event.inputs.platforms == 'macos' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            target: aarch64-apple-darwin
          - name: macOS Intel
            target: x86_64-apple-darwin
    runs-on: macos-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Restore Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      # Tauri 用变量是否存在判断是否签名；空 APPLE_* 也会触发证书导入。
      # 先校验配置，再只向后续构建导出已配置的签名/公证凭证。
      - name: Configure optional macOS signing
        env:
          MACOS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          MACOS_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          MACOS_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          MACOS_APPLE_ID: ${{ secrets.APPLE_ID }}
          MACOS_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          MACOS_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          node <<'NODE'
          const { appendFileSync } = require('node:fs');
          const { randomUUID } = require('node:crypto');
          const signing = ['APPLE_CERTIFICATE', 'APPLE_CERTIFICATE_PASSWORD', 'APPLE_SIGNING_IDENTITY'];
          const notarization = ['APPLE_ID', 'APPLE_PASSWORD', 'APPLE_TEAM_ID'];
          const value = name => process.env[`MACOS_${name}`] || '';
          const hasSigning = signing.some(name => value(name));
          const hasNotarization = notarization.some(name => value(name));
          if (hasSigning && (!value('APPLE_CERTIFICATE') || !value('APPLE_SIGNING_IDENTITY'))) {
            throw new Error('macOS signing requires APPLE_CERTIFICATE and APPLE_SIGNING_IDENTITY.');
          }
          if (hasNotarization && (!hasSigning || !notarization.every(name => value(name)))) {
            throw new Error('macOS notarization requires signing credentials, APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID.');
          }
          for (const name of [...(hasSigning ? signing : []), ...(hasNotarization ? notarization : [])]) {
            const delimiter = `zeditor-${randomUUID()}`;
            appendFileSync(process.env.GITHUB_ENV, `${name}<<${delimiter}\n${value(name)}\n${delimiter}\n`);
          }
          NODE

      - name: Build and stage MCP sidecar
        run: |
          npm run mcp:sidecar -- ${{ matrix.target }}

      - name: Build and publish Tauri bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Zeditor ${{ env.RELEASE_TAG }}
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}

  build-linux:
    name: Linux x64
    needs: prepare-release
    if: ${{ github.event_name == 'push' || github.event.inputs.platforms == '' || github.event.inputs.platforms == 'all' || github.event.inputs.platforms == 'linux' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout release source
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libgtk-3-dev libssl-dev rpm

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Restore Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and stage MCP sidecar
        run: |
          npm run mcp:sidecar -- x86_64-unknown-linux-gnu

      - name: Build and publish Tauri bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Zeditor ${{ env.RELEASE_TAG }}
          releaseDraft: false
          prerelease: false
          args: --target x86_64-unknown-linux-gnu

  build-windows:
    name: Windows x64 — two-stage signing
    needs: prepare-release
    if: ${{ github.event_name == 'push' || github.event.inputs.platforms == '' || github.event.inputs.platforms == 'all' || github.event.inputs.platforms == 'windows' }}
    # windows-latest 已切到 Windows Server 2025 镜像（20261123 起移除 VBSCRIPT），
    # 而 WiX 3 的 light.exe 做 ICE 校验必须能执行 VBScript，否则报 LGHT0217。
    # 这里固定 Server 2022（VBScript 内置），并由下一步做真实可用性探测。
    runs-on: windows-2022
    env:
      WINDOWS_TARGET: x86_64-pc-windows-msvc
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
      SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
      SIGNPATH_EXECUTABLES_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_EXECUTABLES_ARTIFACT_CONFIGURATION_SLUG }}
      SIGNPATH_INSTALLERS_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_INSTALLERS_ARTIFACT_CONFIGURATION_SLUG }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.WINDOWS_TARGET }}

      - name: Restore Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      # WiX 3 的 light.exe 在 ICE 校验时通过 Windows Script Host 执行 VBScript，
      # 引擎缺失或未注册会报 LGHT0217（脚本引擎注册不正确）。
      # VBSCRIPT 在 Server 2022 上是内置组件、在 Server 2025 上是可选功能，
      # 所以这里不查功能名，而是直接跑一段 VBScript 做真实可用性探测。
      - name: Verify VBScript engine for WiX MSI builds
        shell: pwsh
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          Write-Host "Runner OS: $($os.Caption) $($os.Version)"

          $feature = $null
          try {
            $feature = Get-WindowsOptionalFeature -Online -FeatureName VBSCRIPT -ErrorAction Stop
          }
          catch {
            Write-Host "VBSCRIPT optional feature query unavailable: $($_.Exception.Message)"
          }
          if ($feature) {
            Write-Host "VBSCRIPT optional feature state: $($feature.State)"
            if ($feature.State -ne 'Enabled') {
              throw "WiX light.exe needs the VBSCRIPT optional feature, but it is $($feature.State)."
            }
          }
          else {
            Write-Host "VBSCRIPT is not exposed as an optional feature on this OS (built-in on Server 2022)."
          }

          $probe = Join-Path $env:RUNNER_TEMP 'wix-vbscript-probe.vbs'
          Set-Content -LiteralPath $probe -Value 'WScript.Echo "vbscript-ok"' -Encoding ascii
          $output = & "$env:SystemRoot\System32\cscript.exe" //nologo //E:vbscript $probe 2>&1
          if ($LASTEXITCODE -ne 0 -or -not ($output -match 'vbscript-ok')) {
            throw "Windows Script Host cannot run VBScript, so WiX light.exe ICE validation would fail (LGHT0217). Output: $output"
          }
          Write-Host "VBScript engine is available."

      - name: Detect SignPath configuration
        id: signpath
        shell: pwsh
        run: |
          "enabled=false" >> $env:GITHUB_OUTPUT
          "SIGNPATH_ENABLED=false" >> $env:GITHUB_ENV
          Write-Host "Code signing disabled for this build."

      - name: Build and stage MCP sidecar
        run: |
          npm run mcp:sidecar -- ${{ env.WINDOWS_TARGET }}

      - name: Build unsigned application executable
        run: npm run tauri build -- --target ${{ env.WINDOWS_TARGET }} --no-bundle --no-sign

      - name: Collect unsigned inner executables
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force signpath-stage-1 | Out-Null
          Copy-Item "src-tauri/target/$env:WINDOWS_TARGET/release/zeditor.exe" signpath-stage-1/zeditor.exe

      - name: Upload inner executables for provenance
        id: upload-unsigned-executables
        uses: actions/upload-artifact@v7
        with:
          name: windows-unsigned-executables-${{ github.run_id }}
          path: signpath-stage-1
          if-no-files-found: error
          retention-days: 14

      - name: Submit inner executables to SignPath (manual approval)
        if: steps.signpath.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_EXECUTABLES_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-executables.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-stage-1

      - name: Install signed inner executables
        if: steps.signpath.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $signedApp = Get-ChildItem signed-stage-1 -Recurse -File -Filter zeditor.exe | Select-Object -First 1
          if (-not $signedApp) { throw "SignPath did not return the application executable." }
          Copy-Item $signedApp.FullName "src-tauri/target/$env:WINDOWS_TARGET/release/zeditor.exe" -Force

      - name: Verify signed inner executables
        if: steps.signpath.outputs.enabled == 'true'
        shell: pwsh
        run: ./scripts/verify-windows-signatures.ps1 -BundleDirectory signed-stage-1

      - name: Bundle MSI and NSIS installers
        id: bundle-installers
        run: npm run tauri bundle -- --target ${{ env.WINDOWS_TARGET }} --bundles msi,nsis --no-sign

      # light.exe 的真实报错（ICE/LGHT0217/缺文件等）过去被 @tauri-apps/cli 2.11 吞掉，
      # 日志里只剩 "failed to run light.exe"。升级到 2.12.6 后 bundle 步骤会直接打印错误；
      # 这一步是兜底：用与 tauri 完全相同的参数手动重跑 light（完整环境 + tauri 清空环境
      # 两种方式），并核对 main.wxs 里每个 Source 文件是否存在，确保无论如何都能拿到根因。
      - name: Diagnose WiX light failure
        if: ${{ failure() && steps.bundle-installers.outcome == 'failure' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host "== OS =="
          $os = Get-CimInstance Win32_OperatingSystem
          Write-Host "$($os.Caption) $($os.Version)"

          $wixTools = Join-Path $env:LOCALAPPDATA 'tauri\WixTools314'
          $wixDir = "src-tauri/target/$env:WINDOWS_TARGET/release/wix/x64"
          if (-not (Test-Path $wixDir)) { $wixDir = "src-tauri/target/$env:WINDOWS_TARGET/release/wix" }
          Write-Host "== wix dir: $wixDir =="
          Get-ChildItem -LiteralPath $wixDir -Force -ErrorAction SilentlyContinue |
            Format-Table Name, Length -AutoSize | Out-String | Write-Host

          $mainWxs = Join-Path $wixDir 'main.wxs'
          if (Test-Path $mainWxs) {
            Write-Host "== Source files referenced by main.wxs =="
            $m = Select-String -LiteralPath $mainWxs -Pattern 'Source="([^"]+)"' -AllMatches
            $sources = $m.Matches | ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique
            foreach ($s in $sources) {
              $candidates = @(
                $s,
                (Join-Path $wixDir $s),
                (Join-Path (Split-Path $wixDir -Parent) $s),
                (Join-Path "src-tauri/target/$env:WINDOWS_TARGET/release" $s)
              )
              $found = $false
              foreach ($c in $candidates) {
                if (Test-Path -LiteralPath $c -ErrorAction SilentlyContinue) { $found = $true; break }
              }
              if ($found) { Write-Host "FOUND     $s" } else { Write-Host "MISSING   $s" }
            }
          }
          else {
            Write-Host "main.wxs not found at $mainWxs"
          }

          $light = Join-Path $wixTools 'light.exe'
          if (-not (Test-Path $light)) { Write-Host "light.exe not found: $light"; exit 0 }

          Push-Location $wixDir
          $loc = Get-ChildItem -Filter *.wxl -ErrorAction SilentlyContinue | Select-Object -First 1
          $wixobjs = Get-ChildItem -Filter *.wixobj -ErrorAction SilentlyContinue | ForEach-Object { $_.Name }
          $outMsi = Join-Path (Get-Location) 'light-diag-output.msi'
          $lightArgs = @('-o', $outMsi, '-cultures:en-us')
          if ($loc) { $lightArgs += @('-loc', $loc.Name) }
          $lightArgs += $wixobjs
          $lightArgs += @('-ext', (Join-Path $wixTools 'WixUIExtension.dll'))
          $lightArgs += @('-ext', (Join-Path $wixTools 'WixUtilExtension.dll'))

          Write-Host "== rerun light with full environment =="
          Write-Host "light.exe $($lightArgs -join ' ')"
          & $light @lightArgs
          Write-Host "light exit code: $LASTEXITCODE"

          # 按 tauri clear_env_for_wix 的方式清空环境再跑一次（只保留 SYSTEMROOT/TMP/TEMP/TAURI*）
          $saved = @(Get-ChildItem Env:)
          foreach ($e in $saved) {
            if ($e.Name -notlike 'TAURI*' -and $e.Name -notin @('SYSTEMROOT', 'TMP', 'TEMP')) {
              Remove-Item -LiteralPath "Env:$($e.Name)" -ErrorAction SilentlyContinue
            }
          }
          Write-Host "== rerun light with tauri-cleared environment =="
          & $light @lightArgs
          Write-Host "light(cleared env) exit code: $LASTEXITCODE"
          foreach ($e in @(Get-ChildItem Env:)) {
            Remove-Item -LiteralPath "Env:$($e.Name)" -ErrorAction SilentlyContinue
          }
          foreach ($e in $saved) {
            Set-Item -LiteralPath "Env:$($e.Name)" -Value $e.Value -ErrorAction SilentlyContinue
          }
          Pop-Location
          exit 0

      - name: Collect unsigned installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force signpath-stage-2 | Out-Null
          $bundleRoot = "src-tauri/target/$env:WINDOWS_TARGET/release/bundle"
          $installers = Get-ChildItem $bundleRoot -Recurse -File | Where-Object { $_.Extension -in '.msi', '.exe' }
          if (($installers | Measure-Object).Count -lt 2) { throw "Expected both MSI and NSIS installers." }
          $installers | Copy-Item -Destination signpath-stage-2

      - name: Upload installers for provenance
        id: upload-unsigned-installers
        uses: actions/upload-artifact@v7
        with:
          name: windows-unsigned-installers-${{ github.run_id }}
          path: signpath-stage-2
          if-no-files-found: error
          retention-days: 14

      - name: Submit installers to SignPath (manual approval)
        if: steps.signpath.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_INSTALLERS_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-installers.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-stage-2

      - name: Verify signed installers
        if: steps.signpath.outputs.enabled == 'true'
        shell: pwsh
        run: ./scripts/verify-windows-signatures.ps1 -BundleDirectory signed-stage-2

      - name: Publish Windows installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $source = if ($env:SIGNPATH_ENABLED -eq 'true') { 'signed-stage-2' } else { 'signpath-stage-2' }
          $installers = Get-ChildItem $source -Recurse -File | Where-Object { $_.Extension -in '.msi', '.exe' }
          foreach ($installer in $installers) {
            gh release upload $env:RELEASE_TAG $installer.FullName --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { throw "Uploading $($installer.Name) failed." }
          }
